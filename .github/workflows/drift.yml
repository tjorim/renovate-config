name: Check consumer config drift
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare examples with consumer default branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-drift.py
